<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atland Oaks</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so a direct request for a
      // route like /services returns this 404 page. This redirects back to
      // index.html, encoding the original path in the query string so
      // index.html can restore it. See https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + "/?/" +
        l.pathname.slice(1).replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
